<div class="layers-head">Gọn — bật sẵn</div>
<label class="check check-wide" title="Vùng thanh khoản BSL (cam) / SSL (xanh ngọc) vẽ từ đỉnh/đáy ITH/ITL gốc, chỉ hiện từ lúc xác nhận: còn nguyên = nét liền; sweep / run dừng ở nến lấy; nét đứt = đã lấy, chờ biết sweep hay run. Hiện 2 vùng còn nguyên gần nhất mỗi phía + tối đa 3 vùng đã sweep / run gần con trỏ nhất mỗi phía (trong 60 nến) + vùng đang chờ. Dải đáy chart = order flow sau mỗi nến (chữ ở đầu mỗi đoạn): run hoặc shift đặt chiều, run phía ngược → chưa rõ, shift lật thẳng. Dòng trạng thái ở góc trên. Mô tả, không phải dự báo."><input type="checkbox" data-layer="ict_flow" checked><span class="sw sw-ict-flow"></span><span>Order flow + vùng thanh khoản</span></label>
<label class="check" title="Shift = sweep rồi displacement ngược chiều trong cửa sổ: đoạn «Shift ↓/↑» tại mức bị quét, kèm hộp FVG do chính nến displacement tạo ra (viền chấm khi đã lấp)"><input type="checkbox" data-layer="ict_shift" checked><span class="sw sw-ict-shift"></span><span>Shift (+FVG)</span></label>
<label class="check" title="Order block (lõi 0.5.0): chuỗi nến ngược màu cuối trước displacement của shift, chỉ thân; chỉ hiện khi giá đã vượt đầu xa của khối. Hộp xanh = OB tăng, đỏ = OB giảm; nét liền = còn mở, đứt = đã chạm lần đầu, chấm = hỏng (close vượt mép xa) / hết hạn. Đường chấm giữa hộp = mean threshold. Mô tả, chưa phải tín hiệu."><input type="checkbox" data-layer="ict_ob"><span class="sw sw-ict-ob"></span><span>Order block</span></label>
<label class="check" title="OTE (lõi 0.5.0): vùng hồi 62–79% của nhịp từ cực trị cú quét tới đỉnh/đáy mới sau shift. Hộp vàng nét đứt = nhịp đang chờ (vùng sẽ xét ở nến sau), đường chấm = điểm ngọt 70,5%, nét đứt mờ = gốc nhịp (thủng là hỏng); hộp vàng liền = OTE vừa vào. Mô tả, chưa phải tín hiệu."><input type="checkbox" data-layer="ict_ote"><span class="sw sw-ict-ote"></span><span>OTE 62–79%</span></label>
<label class="check" title="Trạng thái (lõi 0.9.1 — v2): «đường trend» trên giá — xanh dưới giá khi trend ↑ (đáy 4 giờ trước: close thủng là hết trend), đỏ trên giá khi trend ↓, chàm giữa hộp khi range, không vẽ khi nhiễu. Trend ↑ / ↓ (cấu trúc swing cùng chiều + lực ER / ADX + động lượng 8 giờ; giữ tới CHoCH, thủng kênh 4 giờ hoặc lực tắt), range (hộp 6 giờ rộng 1,5–4,5 ATR, mỗi biên được thăm lại ≥ 2 lần; giữ tới khi 2 close phá biên — hộp chàm), nhiễu (còn lại); vạch tím mảnh sát đáy (trên dải order flow) = nén (biến động co lại, cờ đi kèm). Thoát do sự kiện đã xác nhận đổi ngay, còn lại giữ đủ «giữ trạng thái mới» (mặc định 2). Mô tả hình dạng giá, không phải dự báo hướng (tham số nâng cao nd_kieu = v1 để xem cách cũ)."><input type="checkbox" data-layer="ict_nd_state" checked><span class="sw sw-ict-nd"></span><span>Trạng thái (trend / range / sideway)</span></label>
<div class="layers-sub">
  <label class="check" data-requires="ict_nd_state" title="Bảng «Nhận diện» ở góc trên bên trái chart, dưới dòng trạng thái: trạng thái, còn giữ, khoảng 4h, xác suất chạm mức gần, phá biên — ở nến con trỏ, kèm điểm thật. Bấm tiêu đề bảng để thu gọn."><input type="checkbox" data-layer="ict_nd_panel" data-requires="ict_nd_state" checked><span class="sw sw-ict-band"></span><span>Bảng nhận diện</span></label>
  <label class="check" data-requires="ict_nd_state" title="Xem lại: vẽ mọi range đã qua (tối đa 40), biên tô xanh / đỏ khi bị phá lên / xuống. Tắt = chỉ range đang có + range gần nhất."><input type="checkbox" data-layer="ict_nd_review" data-requires="ict_nd_state"><span class="sw sw-ict-nd"></span><span>Lịch sử range</span></label>
</div>
<label class="check" title="Khung trạng thái: chart riêng ngay dưới chart giá, cùng trục thời gian — cuộn / zoom / crosshair đi theo chart chính; replay chỉ vẽ tới nến con trỏ. Cột xanh hướng lên = trend lên, cột đỏ hướng xuống = trend xuống (cao theo độ mạnh 0–1 của lõi — chỉ để hiển thị, không phải xác suất); khối chàm đối xứng quanh 0 = range; vạch xám mảnh đối xứng = sideway nhiễu; dải tím trên cùng = nén (biến động co lại — cờ đi kèm trạng thái, không phải trạng thái); trống = chưa đủ nến (đầu lần chạy, hoặc sau khoảng trống thiếu dữ liệu; nghỉ cuối tuần / lễ theo lịch phiên — có lịch cho XAUUSD, EURUSD — thì trạng thái chạy tiếp, lõi ≥ 0.9.2). Dòng chữ trên khung: chú giải màu + trạng thái ở nến dưới chuột (mặc định nến con trỏ). Đọc thẳng cột trạng thái của lõi, không tính lại. Mô tả hình dạng giá, không phải dự báo hướng."><input type="checkbox" data-layer="ict_nd_pane" checked><span class="sw sw-ict-pane"></span><span>Khung trạng thái (dưới chart)</span></label>
<label class="check" title="Đường chấm «chạm 1h x% · 4h y%» trên vùng thanh khoản gần nhất / PDH / PDL / biên range = xác suất mức đó bị chạm trong 1 giờ / 4 giờ tới (chỉ vẽ mức có xác suất 4h ≥ 10%, tối đa 2 mỗi phía; nét đậm = xác suất cao). Khoảng giá 80% 1h / 4h ghi bằng số ở bảng «Nhận diện» và dòng trạng thái. Không nói giá lên hay xuống. Rê chuột vào đường để xem điểm thật tới nến đó (Brier so với B0, chạm thật / kỳ vọng)."><input type="checkbox" data-layer="ict_nd_band" checked><span class="sw sw-ict-band"></span><span>Xác suất chạm 1h / 4h</span></label>
<label class="check" title="Khoảng trống thiếu dữ liệu trong phiên theo lịch khai báo"><input type="checkbox" data-layer="ict_gap" checked><span class="sw sw-dataq"></span><span>Khoảng trống bất thường</span></label>
<label class="check check-wide" title="Vẽ thêm các lớp bên dưới (mỗi lớp giữ lựa chọn riêng). Tắt = về chế độ Gọn."><input type="checkbox" data-layer="ict_detail"><span class="sw sw-ict-detail"></span><span><strong>Chi tiết</strong> — cấu trúc, range, FVG…</span></label>

  <label class="check" data-requires="ict_detail" title="Mọi vùng BSL/SSL còn nguyên (không chỉ 2 gần nhất mỗi phía) — nét mảnh, mờ. Sweep / run / chưa rõ đã nằm trên đường vùng ở chế độ Gọn."><input type="checkbox" data-layer="ict_liq" data-requires="ict_detail"><span class="sw sw-ict-liq"></span><span>Mọi vùng còn nguyên</span></label>
